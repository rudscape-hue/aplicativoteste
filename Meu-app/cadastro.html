<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda Paulo Afonso - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>🛒 VENDA PAULO AFONSO</h1>
        <p>Cadastre-se para começar a anunciar</p>
        
        <nav class="nav-menu">
            <a href="index.html">Produtos</a>
            <a href="cadastro.html" class="ativo">Criar Conta</a>
            <a href="anunciar.html">Anunciar Produto</a>
        </nav>
    </header>

    <div class="auth-container">
        <h2>Criar Conta</h2>
        
        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Seu nome">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>

            <button type="submit" class="btn-principal">Cadastrar e Entrar</button>
        </form>

        <p id="mensagemFeedback"></p>
    </div>

    <footer class="main-footer">
        App criado por: Rudson Santos Rodrigues
    </footer>

    <!-- Chamando o arquivo script.js externo -->
    <script src="script.js"></script>
</body>
</html>
