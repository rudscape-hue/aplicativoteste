<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda Paulo Afonso - Perfil do Vendedor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if (!usuarioLogado) {
            alert("Acesso negado! Faça login para acessar seu perfil.");
            window.location.href = 'login.html';
        }
    </script>

    <header class="main-header">
        <h1>🛒 VENDA PAULO AFONSO</h1>
        <p>Configurações do Perfil do Vendedor</p>
        
        <nav class="nav-menu">
            <a href="index.html">Produtos</a>
            <a href="anunciar.html">Anunciar Produto</a>
            <a href="painel.html">Meus Pedidos</a>
            <a href="perfil.html" class="ativo">Meu Perfil PIX</a>
            <a href="cadastro.html">Criar Conta</a>
            <a href="login.html">Entrar</a>
            <a href="#" id="btnSair" style="color: #dc3545; font-weight: bold;">Sair</a>
        </nav>
    </header>

    <div class="auth-container" style="max-width: 500px;">
        <h2>Dados de Recebimento (PIX)</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Cadastre a sua chave PIX para que os compradores possam pagar diretamente para você.</p>
        
        <form id="formPerfil">
            <div class="input-group">
                <label for="nomePerfil">Nome do Vendedor</label>
                <input type="text" id="nomePerfil" disabled style="background-color: #e9ecef; cursor: not-allowed;">
            </div>

            <div class="input-group">
                <label for="chavePix">Sua Chave PIX (E-mail, CPF, Telefone ou Chave Aleatória)</label>
                <input type="text" id="chavePix" required placeholder="Ex: seuemail@gmail.com ou (75) 99999-9999">
            </div>

            <button type="submit" class="btn-principal" style="width: 100%; margin-top: 10px;">Salvar Chave PIX</button>
        </form>

        <p id="feedbackPerfil" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <footer class="main-footer">
        App criado por: Rudson Santos Rodrigues
    </footer>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
        document.getElementById('nomePerfil').value = usuario.nome;

        const chavesPix = JSON.parse(localStorage.getItem('chavesPixVendedores')) || {};
        if (chavesPix[usuario.email]) {
            document.getElementById('chavePix').value = chavesPix[usuario.email];
        }

        const formPerfil = document.getElementById('formPerfil');
        const feedbackPerfil = document.getElementById('feedbackPerfil');

        formPerfil.addEventListener('submit', function(e) {
            e.preventDefault();

            const chaveDigitada = document.getElementById('chavePix').value.trim();

            if (!chaveDigitada) {
                alert("Por favor, informe uma chave PIX válida.");
                return;
            }

            chavesPix[usuario.email] = chaveDigitada;
            localStorage.setItem('chavesPixVendedores', JSON.stringify(chavesPix));

            feedbackPerfil.style.color = 'green';
            feedbackPerfil.textContent = 'Chave PIX salva com sucesso!';

            setTimeout(() => {
                feedbackPerfil.textContent = '';
            }, 2500);
        });

        const btnSair = document.getElementById('btnSair');
        if (btnSair) {
            btnSair.addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm("Você tem certeza que deseja sair da sua conta?")) {
                    localStorage.removeItem('usuarioLogado');
                    alert("Você saiu com sucesso!");
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
