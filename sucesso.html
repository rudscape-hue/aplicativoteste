<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda Paulo Afonso - Compra Realizada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if (!usuarioLogado) {
            window.location.href = 'login.html';
        }
    </script>

    <header class="main-header">
        <h1>🛒 VENDA PAULO AFONSO</h1>
        <p>Parabéns pela aquisição!</p>
        
        <nav class="nav-menu">
            <a href="index.html">Produtos</a>
            <a href="anunciar.html">Anunciar Produto</a>
            <a href="painel.html">Meus Pedidos</a>
            <a href="perfil.html">Meu Perfil PIX</a>
            <a href="#" id="btnSair" style="color: #dc3545; font-weight: bold;">Sair</a>
        </nav>
    </header>

    <div class="auth-container" style="max-width: 500px; text-align: center;">
        <div style="font-size: 50px; margin-bottom: 10px;">🎉</div>
        <h2 style="color: #28a745; margin-bottom: 10px;">Pagamento Aprovado!</h2>
        <p style="color: #666; margin-bottom: 25px;">Sua compra foi realizada com sucesso e o vendedor já foi notificado.</p>

        <div id="detalhesPedidoSucesso" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 25px; text-align: left; border: 1px solid #e1e1e1;"></div>

        <a href="index.html" class="btn-principal" style="display: block; text-decoration: none; padding: 12px; font-size: 16px;">Voltar para a Vitrine</a>
    </div>

    <footer class="main-footer">
        App criado por: Rudson Santos Rodrigues
    </footer>

    <script>
        const pedido = JSON.parse(localStorage.getItem('ultimoPedidoSucesso'));
        const container = document.getElementById('detalhesPedidoSucesso');

        if (!pedido) {
            container.innerHTML = '<p>Nenhum pedido recente encontrado.</p>';
        } else {
            container.innerHTML = `
                <h3 style="color: #333; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 8px;">📦 Detalhes do Produto Comprado</h3>
                <p style="margin: 8px 0; font-size: 15px;"><strong>Produto:</strong> ${pedido.produto}</p>
                <p style="margin: 8px 0; font-size: 15px;"><strong>Valor Pago:</strong> R$ ${parseFloat(pedido.preco).toFixed(2)}</p>
                <p style="margin: 8px 0; font-size: 15px;"><strong>Forma de Pagamento:</strong> <span style="color: #007bff; font-weight: bold;">${pedido.formaPagamento}</span></p>
                <p style="margin: 8px 0; font-size: 15px;"><strong>Vendedor:</strong> ${pedido.vendedor}</p>
                <p style="margin: 8px 0; font-size: 15px;"><strong>Data do Pedido:</strong> ${pedido.data}</p>
            `;
        }

        const btnSair = document.getElementById('btnSair');
        if (btnSair) {
            btnSair.addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm("Você tem certeza que deseja sair da sua conta?")) {
                    localStorage.removeItem('usuarioLogado');
                    alert("Você saiu com sucesso!");
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
