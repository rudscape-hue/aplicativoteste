<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anunciar Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Anunciar Produto</h1>
        <nav class="nav-menu">
            <a href="index.html">Produtos</a>
            <a href="anunciar.html" class="ativo">Anunciar Produto</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="input-group">
            <label>Título do Produto:</label>
            <input type="text" id="titulo" placeholder="Ex: Bicicleta usada">
        </div>
        <div class="input-group">
            <label>Preço (R$):</label>
            <input type="number" id="preco" placeholder="0.00">
        </div>
        <div class="input-group">
            <label>Descrição:</label>
            <input type="text" id="descricao" placeholder="Detalhes do produto">
        </div>
        <div class="input-group">
            <label>Foto do Produto:</label>
            <input type="file" id="imagemProduto" accept="image/*">
        </div>
        <button class="btn-principal" onclick="salvarProduto()">Publicar Anúncio</button>
    </div>

    <script>
        function salvarProduto() {
            const titulo = document.getElementById('titulo').value;
            const preco = document.getElementById('preco').value;
            const descricao = document.getElementById('descricao').value;
            const inputFile = document.getElementById('imagemProduto');
            const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));

            if (!titulo || !preco) {
                alert("Preencha o título e o preço!");
                return;
            }

            // Função para ler a imagem e salvar tudo junto
            if (inputFile.files && inputFile.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const imagemBase64 = e.target.result;
                    gravarNoLocalStorage(imagemBase64);
                };

                reader.readAsDataURL(inputFile.files[0]);
            } else {
                // Se não escolher imagem, salva sem foto
                gravarNoLocalStorage('');
            }
        }

        function gravarNoLocalStorage(imagemUrl) {
            const titulo = document.getElementById('titulo').value;
            const preco = document.getElementById('preco').value;
            const descricao = document.getElementById('descricao').value;
            const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));

            const novoProduto = {
                id: Date.now().toString(),
                titulo: titulo,
                preco: preco,
                descricao: descricao,
                imagem: imagemUrl,
                vendedor: usuario ? usuario.nome : "Anônimo"
            };

            const listaProdutos = JSON.parse(localStorage.getItem('listaProdutos')) || [];
            listaProdutos.push(novoProduto);

            localStorage.setItem('listaProdutos', JSON.stringify(listaProdutos));
            
            alert("Produto anunciado com sucesso!");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
